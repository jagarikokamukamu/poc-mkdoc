[project]
name = "poc-mkdoc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.1",
    "mkdocs-print-label-plugin",
    "mkdocs-print-site-plugin>=2.8",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
]

[tool.uv.workspace]
members = [
    "mkdocs-print-label-plugin",
]

[tool.uv.sources]
mkdocs-print-label-plugin = { workspace = true }
